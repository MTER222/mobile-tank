<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mobile Tank MP</title>
<style>
html,body{
  margin:0; padding:0; background:#000; color:#0f0;
  overflow:hidden;
  touch-action:none;
  overscroll-behavior:none;
  font-family:system-ui;
}
#ui{
  position:fixed; inset:0; pointer-events:none;
}
.joy{
  position:absolute;
  width:140px; height:140px;
  border-radius:50%;
  background:rgba(255,255,255,0.08);
  border:2px solid rgba(255,255,255,0.3);
}
#joyL{ left:20px; bottom:20px; }
#joyR{ right:20px; bottom:20px; }
.knob{
  position:absolute;
  width:60px; height:60px;
  left:40px; top:40px;
  border-radius:50%;
  background:rgba(255,255,255,0.5);
}
#fire{
  position:absolute;
  right:180px; bottom:40px;
  width:120px; height:120px;
  border-radius:50%;
  background:rgba(255,0,0,0.6);
  text-align:center;
  line-height:120px;
  font-size:24px;
}
#hud{
  position:absolute; top:10px; left:10px;
  font-size:14px;
}
</style>
</head>
<body>
<div id="ui">
  <div id="joyL" class="joy"><div class="knob"></div></div>
  <div id="joyR" class="joy"><div class="knob"></div></div>
  <div id="fire">FIRE</div>
  <div id="hud">HP: <span id="hp">100</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const ws = new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host);
let myId=null, state={p:[],b:[]};

ws.onmessage=e=>{
  const m=JSON.parse(e.data);
  if(m.t==='init') myId=m.id;
  if(m.t==='state') state=m;
};

const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,100);
const ren=new THREE.WebGLRenderer({antialias:false});
ren.setSize(innerWidth,innerHeight);
document.body.appendChild(ren.domElement);

window.addEventListener('resize',()=>{
  cam.aspect=innerWidth/innerHeight;
  cam.updateProjectionMatrix();
  ren.setSize(innerWidth,innerHeight);
});

scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1));
const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(100,100),
  new THREE.MeshBasicMaterial({color:0x222222})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

const tanks={}, bullets=[];
function makeTank(c){
  const g=new THREE.Group();
  const body=new THREE.Mesh(
    new THREE.BoxGeometry(1,0.5,1.5),
    new THREE.MeshBasicMaterial({color:c})
  );
  body.position.y=0.25;
  g.add(body);
  scene.add(g);
  return g;
}

let input={f:0,r:0,fire:0};

function joy(el,cb){
  let id=null;
  const k=el.querySelector('.knob');
  el.addEventListener('pointerdown',e=>{
    id=e.pointerId; el.setPointerCapture(id);
  });
  el.addEventListener('pointermove',e=>{
    if(e.pointerId!==id)return;
    const r=el.getBoundingClientRect();
    let x=e.clientX-(r.left+r.width/2);
    let y=e.clientY-(r.top+r.height/2);
    x=Math.max(-50,Math.min(50,x));
    y=Math.max(-50,Math.min(50,y));
    k.style.transform=`translate(${x}px,${y}px)`;
    cb(x/50,y/50);
  });
  el.addEventListener('pointerup',()=>{
    id=null; k.style.transform='';
    cb(0,0);
  });
}

joy(document.getElementById('joyL'),(x,y)=>{
  input.f=-y;
});
joy(document.getElementById('joyR'),(x,y)=>{
  input.r=x;
});

document.getElementById('fire').addEventListener('pointerdown',()=>{
  input.fire=1;
});

setInterval(()=>{
  if(ws.readyState===1)
    ws.send(JSON.stringify({t:'input',i:input}));
  input.fire=0;
},50);

function loop(){
  requestAnimationFrame(loop);
  for(const p of state.p){
    if(!tanks[p.id])
      tanks[p.id]=makeTank(p.id===myId?0x00ff00:0xff0000);
    const t=tanks[p.id];
    t.position.set(p.x,0,p.z);
    t.rotation.y=p.r;
    if(p.id===myId){
      cam.position.set(
        p.x-Math.sin(p.r)*4,
        4,
        p.z-Math.cos(p.r)*4
      );
      cam.lookAt(p.x,0.5,p.z);
      document.getElementById('hp').textContent=p.hp;
    }
  }
  ren.render(scene,cam);
}
loop();
</script>
</body>
</html>
